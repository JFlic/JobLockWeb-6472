# Hourly job-board sync.
#
# Runs packages/web/tools/sync-jobs.ts on the runner, straight against the
# Turso database: ~10k company boards take several minutes, past the Vercel
# function's 300s limit, and Actions minutes are free for a public repo. The
# daily Vercel cron (/api/cron/refresh-jobs, 12:00 UTC) stays on as a
# time-boxed backup.
#
# Needs repo secrets DATABASE_URL and DATABASE_AUTH_TOKEN. Use a Turso token
# made for this workflow alone, so it can be revoked without touching Vercel.
#
# Only schedule and manual runs trigger this, never pull requests, so code
# from a fork never runs with these secrets.
#
# Minute 17, not 0: GitHub delays or drops scheduled runs most at the top of
# the hour.
#
# GitHub turns scheduled workflows off after 60 days with no commits to the
# repo; re-enable it from the Actions tab if syncs stop.
name: Sync job board

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      prune:
        description: "Also delete jobs closed for 90+ days"
        type: boolean
        default: false

concurrency:
  group: sync-jobs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      # Postings already judged not new-grad, so Greenhouse descriptions aren't
      # downloaded again every hour just to reject them. Losing it only makes
      # one run slower.
      - name: Restore reject cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: job-sync-rejects.json
          key: job-sync-rejects-${{ github.run_id }}
          restore-keys: job-sync-rejects-

      - name: Sync
        working-directory: packages/web
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_AUTH_TOKEN: ${{ secrets.DATABASE_AUTH_TOKEN }}
          JOB_SYNC_CACHE: ${{ github.workspace }}/job-sync-rejects.json
          JOB_SYNC_PRUNE: ${{ inputs.prune && '1' || '' }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$DATABASE_AUTH_TOKEN" ]; then
            echo "::error::Repo secrets DATABASE_URL and DATABASE_AUTH_TOKEN must both be set."
            exit 1
          fi
          bun tools/sync-jobs.ts
